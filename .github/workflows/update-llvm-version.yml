name: Update LLVM Version

on:
    schedule:
        - cron: "0 0 * * 1" # Run every Monday
    workflow_dispatch: # Allow manual triggers

jobs:
    update-llvm-version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Check latest LLVM version
              id: check-version
              shell: bash
              run: |
                  release=$(curl --fail --silent --show-error --location --retry 3 --max-time 30 \
                      https://api.github.com/repos/llvm/llvm-project/releases/latest)
                  tag=$(jq -er '.tag_name | strings | select(test("\\Allvmorg-[0-9]+\\.[0-9]+\\.[0-9]+\\z"))' <<< "$release") || {
                      echo "LLVM release has no valid stable version tag" >&2
                      exit 1
                  }
                  latest_version=${tag#llvmorg-}
                  current_version=$(sed -nE 's/^set\(LLVM_VERSION "([0-9]+\.[0-9]+\.[0-9]+)"\)$/\1/p' CMakeLists.txt)
                  if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "CMakeLists.txt has no valid LLVM version" >&2
                      exit 1
                  fi

                  if [[ "$latest_version" == "$current_version" ]]; then
                      echo "need_update=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # Use the published checksum for the exact archive CMake downloads.
                  asset="llvm-project-$latest_version.src.tar.xz"
                  sha256=$(jq -er --arg asset "$asset" '
                      [.assets[]? | select(.name == $asset)]
                      | select(length == 1)
                      | .[0].digest
                      | strings
                      | select(test("\\Asha256:[0-9a-f]{64}\\z"))
                      | ltrimstr("sha256:")
                  ' <<< "$release") || {
                      echo "LLVM release has no valid SHA-256 digest for $asset" >&2
                      exit 1
                  }

                  {
                      echo "latest_version=$latest_version"
                      echo "current_version=$current_version"
                      echo "sha256=$sha256"
                      echo "need_update=true"
                  } >> "$GITHUB_OUTPUT"

            - name: Update CMakeLists.txt
              if: steps.check-version.outputs.need_update == 'true'
              env:
                  LATEST_VERSION: ${{ steps.check-version.outputs.latest_version }}
                  SHA256: ${{ steps.check-version.outputs.sha256 }}
              run: |
                  updated=$(mktemp ./CMakeLists.txt.XXXXXX)
                  trap 'rm -f -- "$updated"' EXIT
                  sed \
                      -e "s/^set(LLVM_VERSION \".*\")$/set(LLVM_VERSION \"$LATEST_VERSION\")/" \
                      -e "s/URL_HASH SHA256=[a-f0-9]\{64\}$/URL_HASH SHA256=$SHA256/" \
                      CMakeLists.txt > "$updated"
                  grep -Fxq "set(LLVM_VERSION \"$LATEST_VERSION\")" "$updated"
                  grep -Eq "^[[:space:]]+URL_HASH SHA256=$SHA256$" "$updated"
                  cat "$updated" > CMakeLists.txt

            - name: Commit changes
              if: steps.check-version.outputs.need_update == 'true'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "GitHub Action"
                  git checkout -b update-llvm-version
                  git add CMakeLists.txt
                  git commit -m "chore: update LLVM version to ${{ steps.check-version.outputs.latest_version }}"
                  git push -f origin update-llvm-version

            - name: Create Pull Request
              if: steps.check-version.outputs.need_update == 'true'
              run: |
                  gh pr create \
                    --base main \
                    --head update-llvm-version \
                    --title "Update LLVM version to ${{ steps.check-version.outputs.latest_version }}" \
                    --body "Automatic LLVM version update

                  - Updated from ${{ steps.check-version.outputs.current_version }} to ${{ steps.check-version.outputs.latest_version }}
                  - Automatically updated SHA256 checksum

                  Generated by automated workflow."
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}
